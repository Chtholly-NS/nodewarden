name: 同步上游仓库

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: 同步上游代码
    runs-on: ubuntu-slim

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取上游更新
        run: |
          git remote add upstream https://github.com/shuaiplus/nodewarden.git
          git fetch upstream

      - name: 合并上游代码
        run: |
          git checkout main
          git merge upstream/main

      - name: 推送同步结果
        run: |
          git push origin main
